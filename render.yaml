services:
  - type: web
    name: otakuvault-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: TMDB_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: FRONTEND_ORIGIN_REGEX
        sync: false
      - key: PORNHWADB_STORAGE_BUCKET
        sync: false
      - key: PORNHWADB_STORAGE_OBJECT
        sync: false
      - key: PORNHWADB_DATA_URL
        sync: false
      - key: PORNHWADB_DATA_PATH
        sync: false
